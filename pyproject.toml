[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fhe-phml"
version = "0.1.0"
description = "A Multi-Dimensional Framework for Privacy-Preserving Health Machine Learning using Zama FHE"
authors = [
    {name = "Your Name", email = "your-email@cardiff.ac.uk"}
]
requires-python = ">=3.12"
dependencies = [
    "concrete-ml>=1.5.0",   # The core Zama FHE library
    "numpy>=1.26.0",        # Required for Python 3.12 compatibility
    "pandas>=2.1.0",        # Modern pandas for medical dataframes
    "phe>=1.5.0",           # For Component 2: Secure Aggregation
    "scikit-learn>=1.4.0",  # Base ML models for FHE conversion
    "pytest>=8.0.0",        # For Component 5: Evaluation
]

[project.optional-dependencies]
examples = [
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",    # To plot Heart Disease/Pima results
    "seaborn>=0.13.0",
]
